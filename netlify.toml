[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"
  BUN_VERSION = "1.3.9"
  BUN_FLAGS = "--frozen-lockfile"

[context.deploy-preview]
  command = 'bun run build -- --site "$DEPLOY_PRIME_URL"'

[context.branch-deploy]
  command = 'bun run build -- --site "$DEPLOY_PRIME_URL"'
